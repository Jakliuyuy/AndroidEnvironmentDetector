name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & E2E Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android NDK & CMake
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Add Android Build-Tools to PATH
        run: |
          BUILD_TOOLS_DIR=$(find ${ANDROID_HOME}/build-tools/ -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$BUILD_TOOLS_DIR" ]; then
            echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
            echo "Added $BUILD_TOOLS_DIR to PATH"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Generate Local Release Keystore (Fallback if missing)
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias securityrelease \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android_sec_2026 \
              -keypass android_sec_2026 \
              -dname "CN=SecurityEnvironmentCI, OU=SecurityLab, O=SecurityLab, L=Beijing, ST=Beijing, C=CN"
          fi

      - name: Run JVM Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Release APK (R8 Minified)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK Size & Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not generated!"
            exit 1
          fi
          APK_SIZE_BYTES=$(stat -c%s "$APK_PATH")
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $APK_SIZE_BYTES / 1048576}")
          echo "Generated APK: $APK_PATH ($APK_SIZE_MB MB, $APK_SIZE_BYTES bytes)"
          if (( $(echo "$APK_SIZE_MB > 7.0" | bc -l) )); then
            echo "::warning::APK size $APK_SIZE_MB MB exceeds optimal ~5MB threshold!"
          else
            echo "APK size within optimal production range (~5MB)."
          fi
          
          # Verify signature with apksigner if available
          APKSIGNER=$(find ${ANDROID_HOME}/build-tools/ -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying signature with $APKSIGNER..."
            $APKSIGNER verify --verbose "$APK_PATH"
          else
            echo "apksigner not found in build-tools, verifying with jarsigner..."
            jarsigner -verify -verbose -certs "$APK_PATH" || true
          fi

      - name: Run Full Python E2E Test Suite
        run: ./scripts/run_e2e_tests.sh --all

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
